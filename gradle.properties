org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Bump when the hub must require newer stand-ins (the stand-in protocol changed). It is baked into
# every stand-in as the dev.jonathanclark.tvshortcuts.STANDIN_VERSION meta-data and into the hub
# as BuildConfig.STANDIN_VERSION.
standinVersion=1

# The release version (semver). Tag releases as v<appVersion>, e.g. v1.0.0. Android's versionCode is
# derived from this in build.gradle.kts (major*10000 + minor*100 + patch), so only bump it here.
appVersion=1.0.0
